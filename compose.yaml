services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Local development credentials only.
      POSTGRES_USER: koi
      POSTGRES_PASSWORD: koi_dev
      POSTGRES_DB: koi_dev
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koi -d koi_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
